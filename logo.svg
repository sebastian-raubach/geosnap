<svg width="480" height="240" viewBox="0 0 480 240" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GeoSnap</title>
  <desc>GeoSnap logo — a rounded square containing a winding dashed GPS track ending at a camera pin, with the GeoSnap wordmark to the right.</desc>

  <style>
    @media (prefers-color-scheme: light) {
      .bg   { fill: #eff6ff; }
      .bd   { stroke: #bfdbfe; }
      .path { stroke: #93c5fd; }
      .dot  { fill: #3b82f6; }
      .cam  { fill: #1d4ed8; }
      .cam2 { fill: #eff6ff; }
      .wm   { fill: #1e3a8a; }
      .acc  { fill: #2563eb; }
      .sub  { fill: #3b82f6; }
    }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0f1e38; }
      .bd   { stroke: #1e3a5f; }
      .path { stroke: #1d4ed8; }
      .dot  { fill: #60a5fa; }
      .cam  { fill: #3b82f6; }
      .cam2 { fill: #0f1e38; }
      .wm   { fill: #bfdbfe; }
      .acc  { fill: #60a5fa; }
      .sub  { fill: #3b82f6; }
    }
    .wordmark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
  </style>

  <!-- box -->
  <rect x="20" y="20" width="200" height="200" rx="30" class="bg"/>
  <rect x="20" y="20" width="200" height="200" rx="30" fill="none" class="bd" stroke-width="1.5"/>

  <!-- dashed track -->
  <path d="M55 195 C55 195 70 158 90 147 C108 137 110 165 130 155 C150 145 144 115 168 108 C180 104 188 121 196 131"
        class="path" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
  <path d="M196 131 C210 148 198 88 178 72"
        class="path" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>

  <!-- track dots -->
  <circle cx="55"  cy="195" r="5" class="dot"/>
  <circle cx="90"  cy="147" r="5" class="dot"/>
  <circle cx="130" cy="155" r="5" class="dot"/>
  <circle cx="168" cy="108" r="5" class="dot"/>

  <!-- camera pin -->
  <path d="M163 72 C163 72 163 50 178 50 C193 50 193 72 193 72 C193 72 178 92 178 92 C178 92 163 72 163 72 Z" class="cam"/>
  <rect x="169" y="54" width="18" height="14" rx="3.5" class="cam2" opacity="0.25"/>
  <circle cx="178" cy="62" r="6.5" class="cam2" opacity="0.9"/>
  <circle cx="178" cy="62" r="3"   class="cam"/>

  <!-- wordmark -->
  <text x="242" y="126" class="wordmark wm" font-size="52" font-weight="700" letter-spacing="-1.5">
    <tspan class="acc">Geo</tspan><tspan>Snap</tspan>
  </text>
  <text x="244" y="155" class="wordmark sub" font-size="12" font-weight="400" letter-spacing="3.5">GPX  IMAGE  GEOTAGGING</text>
</svg>
